name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply deer-duo --remote

      - name: Deploy Preview (PR)
        id: deploy
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Smoke test preview
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.deployment-url }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::warning::No deployment-url output from wrangler-action; skipping smoke test"
            exit 0
          fi
          echo "Smoke testing $PREVIEW_URL ..."

          # 1. Unauthenticated /api/me returns 401 (Worker is live)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL/api/me" || echo "000")
          [ "$STATUS" = "401" ] || { echo "::error::GET /api/me expected 401, got $STATUS"; exit 1; }

          # 2. POST /api/login with bad credentials returns 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d '{"username":"nobody","password":"wrong"}' \
            "$PREVIEW_URL/api/login" || echo "000")
          [ "$STATUS" = "401" ] || { echo "::error::POST /api/login expected 401, got $STATUS"; exit 1; }

          echo "All smoke tests passed ✓"

      - name: Deploy to Production (main)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set JWT_SECRET (production)
        if: github.event_name == 'push'
        run: echo "${JWT_SECRET}" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Set ANTHROPIC_API_KEY (production)
        if: github.event_name == 'push' && secrets.ANTHROPIC_API_KEY != ''
        run: echo "${ANTHROPIC_API_KEY}" | npx wrangler secret put ANTHROPIC_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Set TAVILY_API_KEY (production)
        if: github.event_name == 'push' && secrets.TAVILY_API_KEY != ''
        run: echo "${TAVILY_API_KEY}" | npx wrangler secret put TAVILY_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
