name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei
          fc-cache -fv

      - name: Verify Chinese font availability
        run: |
          set -eo pipefail
          fonts_output="$(fc-list :lang=zh)"
          if [ -z "$fonts_output" ]; then
            echo "Error: No Chinese fonts found for lang=zh after installation." >&2
            exit 1
          fi
          echo "Chinese fonts detected (showing up to 20 entries):"
          printf '%s\n' "$fonts_output" | head -20
