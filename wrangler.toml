name = "deer-duo"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "deer-duo"
database_id = "dceba6c0-8eb1-4640-ab6c-66d179129e43"

[ai]
binding = "AI"

# JWT_SECRET must be set as a Wrangler secret (never commit real secrets):
#   npx wrangler secret put JWT_SECRET
# [vars] section intentionally has no JWT_SECRET for production use.
