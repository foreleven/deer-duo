[assets]
directory = "./dist/client"
binding = "ASSETS"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "deer-duo"
database_id = "placeholder-replace-with-real-id"

[vars]
JWT_SECRET = "change-me-in-production"
